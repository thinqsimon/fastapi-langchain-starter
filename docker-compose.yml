# 로컬 개발용 인프라.
#
#   docker compose up -d db              DB만 (기본 개발 방식)
#   docker compose --profile full up     DB + 백엔드 + 프론트엔드 전체
#
# 전체 실행은 "준비물 없이 한 번에 띄워 보고 싶을 때" 씁니다.
# 평소 개발은 DB만 컨테이너로 띄우고 앱은 로컬에서 실행하는 편이 빠릅니다.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # 이미 5432를 쓰는 PostgreSQL이 있으면 .env의 POSTGRES_PORT로 바꾼다.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [full]
    build: ./backend
    environment:
      # 컨테이너끼리는 서비스 이름으로 통신한다(localhost가 아님).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      APP_ENV: local
      APP_PROFILE: ${APP_PROFILE:-diary-coach}
      APP_NAME: ${APP_NAME:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-key-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: [full]
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_APP_PROFILE: ${APP_PROFILE:-diary-coach}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
