# 빌드·테스트 게이트. 로컬과 동일하게 scripts/의 스크립트만 실행한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
  JWT_SECRET_KEY: ci-only-secret-key-with-enough-length-0123456789
  # 실제 LLM은 호출하지 않는다(키 불필요·결과 일정).
  LLM_PROVIDER: fake

jobs:
  verify:
    name: 린트 · 타입 · 단위/API 테스트 · 빌드
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          cd backend && uv sync --locked
          cd ../frontend && npm ci
      - name: Migrate
        run: cd backend && uv run alembic upgrade head
      - name: Verify (lint · type · test · build)
        run: ./scripts/verify.sh

  e2e:
    name: 브라우저 E2E
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          cd backend && uv sync --locked
          cd ../frontend && npm ci
      - name: Install browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Migrate
        run: cd backend && uv run alembic upgrade head
      - name: E2E (가입 → 대화 → 스트리밍)
        run: ./scripts/e2e.sh
      - name: 실패 시 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
